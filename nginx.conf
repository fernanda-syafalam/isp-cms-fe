# nginx site config for the isp-cms-fe SPA (served from /usr/share/nginx/html).
# TLS is terminated upstream by Dokploy's Traefik; this listens on plain HTTP.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Lightweight liveness endpoint for the container healthcheck / Traefik.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths render index.html so the client
    # router can take over (deep links, refresh on a sub-route).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients pin a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security headers. CSP is intentionally permissive on https: sources
    # so cross-origin API calls (api.example.com) and Leaflet map tiles
    # keep working; tighten per your real domains if desired.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Don't leak the nginx version.
    server_tokens off;
}

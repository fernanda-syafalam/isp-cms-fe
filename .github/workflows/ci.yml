name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR or branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Audit • Lint • Typecheck • Test • Build • Size
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking dependency audit (CLAUDE.md security baseline): fail the PR on
      # any high/critical advisory. Fixes are preferred over waivers — see
      # pnpm.overrides in package.json. If a future advisory has no trivial fix,
      # do NOT silently drop this gate: bump the dep, add a scoped override, or
      # (last resort) make this step non-blocking WITH a loud TODO referencing
      # the advisory so it stays visible.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle size budget
        run: pnpm size
